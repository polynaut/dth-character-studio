name: 🔖 Version

# Maintains a "version packages" PR. When feature PRs that contain changesets
# land on main, this opens/updates a PR that bumps versions + writes CHANGELOGs.
# Merging that PR is what triggers a release (see release.yml).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: version-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Under changesets/action v1 the changeset-release/main push used the
          # credentials this checkout persisted, and a github-actions[bot] push
          # tripped the public-repo first-time-contributor approval gate (every
          # validation run sat "action_required"; measured 2026-08-03, see
          # .ai/gotchas.md). v2 pushes via the GitHub API with its github-token
          # input instead (push-with-git-cli defaults to false), so that input
          # carries the PAT now — this one is kept as belt-and-braces so any
          # git-side push also goes out as the PAT owner.
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
      # pnpm version comes from package.json "packageManager" (no `version:` here,
      # or action-setup errors on the duplicate).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        id: changesets
        with:
          # v2 renamed the inputs (version→version-script, title→pr-title,
          # commit→commit-message) and made the token an INPUT — its API calls
          # (PR create/update, and the branch push: v2's default
          # push-with-git-cli:false pushes via the API, not the checkout's git
          # credentials) authenticate with github-token, no longer with an env
          # var. Prefer the PAT (secret CHANGESETS_TOKEN): GitHub deliberately
          # does NOT re-trigger `on: pull_request` workflows for PRs opened by
          # GITHUB_TOKEN, so a version PR authored by it gets no CI runs and
          # (with required checks on main) can't be merged without manual
          # close/reopen. A PAT-authored PR fires the checks normally — no
          # babysitting. Falls back to GITHUB_TOKEN when the secret is absent.
          # See docs/devops.md.
          github-token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          pr-title: '🚢 chore: version packages'
          commit-message: 'chore: version packages'
        env:
          # Still needed alongside the input: @changesets/get-github-info reads
          # env GITHUB_TOKEN inside `pnpm version-packages` (changelog-github
          # resolves PR/commit/author links through it) and fails loud without.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      # The action writes an npm-centric boilerplate intro ("…publish to npm
      # yourself or setup this action to publish automatically…") that is wrong
      # for this repo — everything IS automated. Replace the intro with what
      # merging actually does, keep the generated "# Releases" section.
      - name: De-boilerplate the version PR description
        # v2 renamed the output pullRequestNumber → pr-number (hyphen forces
        # the bracket syntax).
        if: steps.changesets.outputs['pr-number']
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          num='${{ steps.changesets.outputs['pr-number'] }}'
          body=$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          case "$body" in
            *'# Releases'*) ;;
            *) echo "no '# Releases' section — leaving the body untouched"; exit 0 ;;
          esac
          rest="${body#*'# Releases'}"
          printf '%s\n\n%s\n%s\n\n%s\n\n# Releases%s' \
            '# The release train' \
            '> Every merge to `main` that carries changesets refreshes this PR.' \
            '> Merge to `main` will trigger the [🚀 Release workflow](https://github.com/polynaut/dth-character-studio/actions/workflows/release.yml) which runs: `build win/mac` → `⚠️ approval` → `sign win/mac` → `publish`' \
            '🚢 Ship the release by merging this PR' \
            "$rest" | gh pr edit "$num" --repo "$GITHUB_REPOSITORY" --body-file -
