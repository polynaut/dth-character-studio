name: 🩺 Runner self-check

# Manual-only readiness probe for the self-hosted Certum signer runner.
# Confirms the runner picks up jobs and has the signing toolchain + a reachable
# p11-kit socket — WITHOUT signing anything. Touches no secrets, can't release.
#
# The toolchain/module steps are best-effort probes (report, always exit 0, so
# one odd tool never hides the rest). The LAST step is the real gate: it goes
# red unless the SimplySign code-signing CERT is visible through the socket —
# i.e. unless a release would sign right now.

on:
  workflow_dispatch:
    inputs:
      socket:
        description: "p11-kit socket path override (defaults to the CERTUM_P11_SOCKET repo variable)"
        required: false
        default: ""

# The probe never calls the GitHub API — keep the job token read-only.
permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, certum-signer]
    steps:
      - name: Runner + OS
        shell: bash
        run: |
          echo "Runner : ${RUNNER_NAME:-?} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?})"
          uname -a || true

      - name: Signing toolchain
        if: ${{ always() }}
        shell: bash
        run: |
          set +e   # probe only — never fail the step on a tool quirk
          check() {
            printf '%-16s ' "$1"
            local p
            if p=$(command -v "$1" 2>/dev/null); then
              # --version is unreliable across tools (e.g. pkcs11-tool rejects it);
              # discard its stderr/exit and fall back to just reporting presence.
              local v
              v=$("$1" --version 2>/dev/null | head -n1)
              echo "${v:-present} ($p)"
            else
              echo "MISSING"
            fi
          }
          check osslsigncode   # the Authenticode signer
          check node           # for `tauri signer sign` (updater .sig regen)
          check gh             # to publish the release
          check p11tool        # to list the SimplySign token
          check pkcs11-tool    # optional, alternative token lister
          true

      - name: p11-kit client module
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          found=
          for p in \
            /usr/lib/x86_64-linux-gnu/pkcs11/p11-kit-client.so \
            /usr/lib64/pkcs11/p11-kit-client.so \
            /usr/lib/pkcs11/p11-kit-client.so; do
            if [ -e "$p" ]; then echo "found: $p"; found=1; fi
          done
          [ -n "$found" ] || echo "p11-kit-client.so NOT found in the usual paths"
          true

      - name: SimplySign socket + cert (the gate)
        if: ${{ always() }}
        shell: bash
        env:
          SOCK: ${{ inputs.socket || vars.CERTUM_P11_SOCKET || '/run/p11-kit/p11kit.sock' }}
        run: |
          echo "socket: $SOCK"
          if [ ! -S "$SOCK" ]; then
            echo "::error::p11-kit socket missing at $SOCK — certum-container not running, or its socket isn't shared into this runner (override the path via the workflow input)"
            exit 1
          fi
          echo "socket EXISTS ✓"
          # Plain `p11tool --list-tokens` is BLIND here: it only loads the
          # modules registered with p11-kit (trust + opensc in this image), and
          # P11_KIT_SERVER_ADDRESS is read only by p11-kit-client.so — so it
          # lists "System Trust" whether the session is live or dead (measured
          # 2026-10-23). Load the client module explicitly, exactly like
          # sign-installer.sh, and gate on the CERT, not the token: token +
          # keys without the cert is a real failure mode ("object not found").
          export P11_KIT_SERVER_ADDRESS="unix:path=$SOCK"
          mod=
          for p in \
            /usr/lib/x86_64-linux-gnu/pkcs11/p11-kit-client.so \
            /usr/lib64/pkcs11/p11-kit-client.so \
            /usr/lib/pkcs11/p11-kit-client.so; do
            [ -e "$p" ] && { mod=$p; break; }
          done
          [ -n "$mod" ] || { echo "::error::p11-kit-client.so not found — cannot reach the socket"; exit 1; }
          out=$(p11tool --provider "$mod" --list-all-certs 'pkcs11:model=SimplySign%20C' 2>&1) || true
          echo "$out" | head -n 40
          if echo "$out" | grep -q 'type=cert'; then
            echo "SimplySign code-signing cert visible ✓ — a release would sign now"
          else
            echo "::error::SimplySign cert NOT visible through the socket — the session has lapsed; check the NAS keepalive (see docs/devops.md → Code signing)"
            exit 1
          fi
