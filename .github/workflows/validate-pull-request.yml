name: ✅ Pull Request validation

# Basic checks on every pull request: typecheck, tests, and a web build. The
# version/release workflows only run on pushes to main, so this is the gate that
# catches regressions before a PR is merged.
#
# Also runs the `rust` job on pushes to main — NOT for PR gating, but to warm the
# Rust build cache on the default branch. GitHub only lets PR runs restore caches
# from the default branch, so without this every PR's rust job is a cold rebuild.
# (validate/changeset stay PR-only.)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # PR-only: on a main push the merged PR already validated; this job just
    # duplicates it. (The rust job below is the one that runs on main, to warm
    # the cache.)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # Before install — the hooks run as bare node from the repo root and depend
      # on nothing, so this fails in ~1s when it fails.
      #
      # The gotcha-injection hook extracts each fact from `.ai/*` at runtime by a
      # verbatim ANCHOR phrase, so any doc edit can silently unhook a trigger:
      # `ffi-surface` anchored on "**FFI surface: 52 commands**" and died the day
      # someone re-verified that count to 54 — the fact simply stopped being
      # injected, with nothing on screen to say so. The audit was already a
      # written ritual ("run it after a doc rewrite") and a doc CORRECTION still
      # walked past it. So it is a check now, not a reminder — the same call this
      # repo made for branch tracking. `--audit` catches all four quiet deaths
      # (stale / ambiguous / truncated-past-the-anchor / multiline); the test
      # asserts the payload a session actually receives.
      - name: Gotcha hooks (anchors resolve + payload is delivered)
        run: |
          node .claude/hooks/inject-gotchas.mjs --audit
          node .claude/hooks/inject-gotchas.test.mjs
      - run: pnpm install --frozen-lockfile
      # oxlint exits non-zero on any ERROR-severity rule, so this fails the check.
      # Beyond the `correctness` category, .oxlintrc.json promotes a handful of
      # real-bug rules from warn→error (no-shadow, jsx-no-constructed-context-values,
      # no-object-type-as-default-prop, no-unnecessary-type-assertion) so they block
      # PRs. High-count INTENTIONAL patterns (no-await-in-loop, react-markdown
      # component maps, promise-in-handler) stay advisory warnings on purpose.
      - name: Lint (oxlint, type-aware — fails on correctness + promoted real-bug rules)
        run: pnpm lint
      # Those advisory warnings are decisions, not debt — but a few hundred of
      # them make a NEW one invisible. The ratchet pins the count PER RULE
      # (.lint-baseline.json), so an added instance fails here and gets a
      # deliberate answer: intentional → bump the baseline in the same commit,
      # otherwise fix it.
      - name: Lint budget (no new advisory warnings)
        run: pnpm lint:budget
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        # Effectively `pnpm -r test`, but per package with its name written to
        # the step summary first — Vitest's built-in CI summary ("Vitest Test
        # Report") doesn't say which package it belongs to, so the three
        # reports were indistinguishable. Globs keep the same topological
        # order (packages/* before apps/*) and pick up future packages.
        shell: bash
        run: |
          for dir in packages/* apps/*; do
            if node -e "process.exit(require('./$dir/package.json').scripts?.test ? 0 : 1)"; then
              name=$(node -p "require('./$dir/package.json').name")
              echo "# \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              pnpm --filter "$name" test
            fi
          done
      - name: Build web
        run: pnpm --filter @dth/web build
      # Cheap (<1s): renders docs/guide → site/guide and statically validates the
      # screenshot references (missing/orphaned PNGs) — the same checks the
      # screenshot suite's coverage test runs, but without Playwright, so a guide
      # page pointing at a nonexistent image can't merge green and break the
      # Pages deploy.
      - name: Build guide site (validates screenshot references)
        run: pnpm build:guide

  # The browser smoke suite: the real SPA against the in-memory fake of the
  # native layer (apps/web/smoke). Catches the integration regressions the unit
  # tests can't see — loader wiring, editor save flow, artifact generation.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cache the ~130 MB Chromium download, keyed on the installed Playwright
      # version — uncached it re-downloads on every PR run (minutes + a
      # download-flake surface). `--with-deps` below still apt-installs the
      # system libraries; only the browser binaries live in this cache.
      - name: Playwright version (cache key)
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright Chromium
        # Cache misses only (= once per Playwright version bump). On a hit the
        # browser binaries come from the cache above, and the hosted runner
        # image already ships Chromium's system libraries — re-running
        # `--with-deps` would apt-install packages for ~30s on every PR.
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @dth/web exec playwright install chromium --with-deps
      - name: Browser smoke (Playwright)
        run: pnpm --filter @dth/web smoke
      # THE EVIDENCE. `trace: 'retain-on-failure'` (playwright.config.ts) writes
      # a full trace for every failed test — DOM snapshot per action, the
      # actionability log, console, network, screenshots — and without this step
      # it is deleted with the runner. Eight-plus smoke failures have now been
      # diagnosed purely by INFERENCE ("a different spec each run, green on
      # rerun, instant locally, therefore contention") because the one artifact
      # that could confirm or refute it never left CI.
      #
      # That inference has a hole worth naming: a `locator.click` timing out at
      # 60s is a 45x outlier against a ~1.3s average, and Playwright's click
      # waits for ACTIONABILITY (visible, stable, unobscured, enabled) — so a
      # stall that long is at least as consistent with the element being covered
      # by a floating layer, or the page being wedged in a render loop (both are
      # measured, documented behaviours in this app: see .ai/gotchas.md on
      # overlay sweeping and on useReactTable identity), as with a busy box.
      # The trace's actionability log says which — it records what Playwright
      # was waiting for and what was on top of the target.
      #
      # NOT `failure()` — that would discard the exact case this step is for.
      # `retries: 1` (playwright.config.ts) means a starved spec passes on
      # attempt two, Playwright reports it `flaky`, and the run EXITS 0. The
      # job is green, `failure()` never fires, and the trace of the failed
      # attempt is deleted with the runner — leaving traces only for tests that
      # fail BOTH attempts, i.e. the reproducible ones that need a trace least.
      #
      # Measured 2026-08-14 on this repo's Playwright, one flaky test:
      #   flaky run → exit 0, `test-results/…/trace.zip` PRESENT
      #   green run → exit 0, no trace files at all
      # So `retain-on-failure` already makes a clean run free, and
      # `if-no-files-found: ignore` absorbs the empty directory.
      #
      # It also turns the artifact into the flake SIGNAL: a `playwright-traces-*`
      # artifact on a GREEN run means a retry was spent, which is otherwise
      # buried in the log of a run nobody opens.
      #
      # The run_attempt suffix keeps a rerun's artifact from colliding with the
      # original's.
      - name: Upload Playwright traces (flake + failure evidence)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces-attempt-${{ github.run_attempt }}
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Every feature PR must ship a changeset (the four packages — web, desktop,
  # rom, ui — are a fixed group, so this is what actually bumps the product
  # version and triggers a release).
  # A PR that legitimately needs no version bump (CI/docs-only) can satisfy this
  # with an empty changeset: `pnpm changeset --empty`.
  # The job runs on EVERY PR so the check always REPORTS — it is a required
  # status check on main, and a skipped job would leave the check "Expected"
  # forever, blocking the merge. The version PR and Dependabot are therefore
  # exempted INSIDE the job (they report success without the requirement):
  # Dependabot can't author changesets — its bumps ride the next release
  # train; add a changeset manually to release one alone.
  changeset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      # Version PR (changeset-release/main) and Dependabot: requirement waived.
      EXEMPT: ${{ github.head_ref == 'changeset-release/main' || github.actor == 'dependabot[bot]' }}
    steps:
      - name: Changeset requirement waived (version PR / Dependabot)
        if: env.EXEMPT == 'true'
        run: echo "::notice::Changeset requirement waived for this PR (version PR / Dependabot)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.EXEMPT != 'true'
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: env.EXEMPT != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.EXEMPT != 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.EXEMPT != 'true'
      - name: Require a changeset
        if: env.EXEMPT != 'true'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      # `changeset status` is satisfied by an EMPTY changeset — correct for a
      # docs/CI-only PR, silent damage on a code PR (no bump, no changelog
      # line). Four code PRs shipped that way in one day with the gate green,
      # so the gate now tells the two cases apart itself.
      - name: Require a REAL changeset when shipped code changed
        if: env.EXEMPT != 'true'
        run: node scripts/require-real-changeset.mjs origin/${{ github.base_ref }}
      # …and the bump TYPE is the next thing left to judgement. The Defaults tab
      # and "Make paths portable" both shipped as `patch`; two features would
      # have released under a patch version and read as bug fixes in four
      # CHANGELOGs, caught only by a human reading the version PR (#710).
      # Signals are structural and few — measured over the last 30 commits on
      # main it flagged exactly those two and nothing else.
      - name: Require a MINOR when the PR adds a capability
        if: env.EXEMPT != 'true'
        run: node scripts/changeset-bump-type.mjs origin/${{ github.base_ref }}

  # The Rust backend wasn't built/tested on PRs — a broken crate (or a reverted
  # alloc pin) only surfaced at release time on main. This job catches both.
  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      # Cache the crate + registry so clippy/test don't rebuild from scratch every
      # PR (this job was ~5.5 min uncached). Keyed on Cargo.lock automatically.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop
          # A fixed shared-key (instead of the default per-job key) so the cache
          # the main-push run saves is the same one PR runs restore — otherwise
          # the keys differ and PRs never hit it.
          shared-key: dth-desktop
      - name: Verify the brotli alloc pins are intact
        shell: bash
        working-directory: apps/desktop
        run: |
          # These exact versions keep brotli 8 working with Tauri (see Cargo.toml).
          # A stray `cargo update` or new dep can silently revert them.
          grep -A1 'name = "alloc-no-stdlib"' Cargo.lock | grep -q 'version = "2.0.4"' \
            || { echo "::error::alloc-no-stdlib is not pinned to 2.0.4 (breaks brotli 8) — re-pin per docs/devops.md"; exit 1; }
          grep -A1 'name = "alloc-stdlib"' Cargo.lock | grep -q 'version = "0.2.2"' \
            || { echo "::error::alloc-stdlib is not pinned to 0.2.2 — re-pin per docs/devops.md"; exit 1; }
      - name: cargo clippy (locked, deny warnings)
        working-directory: apps/desktop
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test (locked)
        working-directory: apps/desktop
        run: cargo test --locked
